<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Centra Norte | Centro comercial y punto de transporte
    </title>

    <meta
      name="description"
      content="Centra Norte: comercios, restaurantes, servicios, eventos y opciones de transporte en zona 17, Ciudad de Guatemala."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="theme-color"
      content="#071a4f"
    />

    <link
      rel="canonical"
      href="https://centranorte.com.gt/"
    />

    <!-- Open Graph: Facebook, WhatsApp y LinkedIn -->
    <meta
      property="og:locale"
      content="es_GT"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Centra Norte"
    />

    <meta
      property="og:title"
      content="Centra Norte | Centro comercial y punto de transporte"
    />

    <meta
      property="og:description"
      content="Comercios, restaurantes, servicios, eventos y opciones de transporte en Centra Norte."
    />

    <meta
      property="og:url"
      content="https://centranorte.com.gt/"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Centra Norte | Centro comercial y punto de transporte"
    />

    <meta
      name="twitter:description"
      content="Comercios, restaurantes, servicios, eventos y opciones de transporte en Centra Norte."
    />

    <!-- Favicons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48x48.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Script inicial de animaciones -->
    <script
      type="module"
      src="/src/reveal-init.js"
    ></script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
